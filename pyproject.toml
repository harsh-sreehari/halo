[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo-security"
version = "0.1.0"
description = "AI-Native Hybrid Application Security Testing (Hybrid-AST) Framework for Business Logic Flaws"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Project HALO Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.10.2",
    "networkx>=3.3",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[project.scripts]
halo = "halo.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/halo"]

[tool.ruff]
line-length = 100
target-version = "py311"
